fragment MaterialUnit on MaterialUnitDto {
  id
  materialId
  unit
  conversionFactor
  isActive
  createdAt
}

fragment Material on MaterialDto {
  id
  key
  description
  baseUnit
  isActive
  materialUnits {
    ...MaterialUnit
  }
}

fragment SimpleMaterial on MaterialDto {
  id
  key
  description
  baseUnit
  isActive
  materialUnits {
    ...MaterialUnit
  }
}
