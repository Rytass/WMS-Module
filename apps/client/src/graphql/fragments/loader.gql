fragment LoaderType on LoaderTypeDto {
  id
  description
  isActive
  key
  referencedQuantity
  createdAt
  updatedAt
}

fragment Loader on LoaderDto {
  id
  serialId
  length
  width
  height
  sizeUnit
  volume
  volumeUnit
  note
  isActive
  createdAt
  type {
    ...LoaderType
  }
  location {
    ...SimpleLocation
  }
}

fragment LoaderWithTotal on LoaderDto {
  id
  serialId
  note
  isActive
  createdAt
  totalQuantity
  type {
    ...LoaderType
  }
  location {
    ...SimpleLocation
  }
}
