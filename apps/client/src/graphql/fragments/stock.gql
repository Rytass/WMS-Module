fragment Stock on StockDto {
  id
  loaderId
  material {
    ...SimpleMaterial
  }
  location {
    ...Location
  }
  batch {
    ...Batch
  }
}

fragment SimpleStock on StockDto {
  id
  loaderId
}

fragment AggregatedStock on AggregatedStockDto {
  id
  quantity
  status
  material {
    ...SimpleMaterial
  }
  batch {
    ...Batch
  }
  location {
    id
    key
  }
  loader {
    ...Loader
  }
}
