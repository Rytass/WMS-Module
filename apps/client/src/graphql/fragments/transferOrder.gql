fragment TransferOrderItem on TransferOrderItemDto {
  id
  targetTransferredQuantity
  unitId
  material {
    ...SimpleMaterial
  }
  batch {
    ...Batch
  }
  location {
    ...SimpleLocation
  }
  loader {
    ...Loader
  }
  saleId
  saleSerialId
  removedAt
  transferredQuantity
}

fragment TransferOrder on TransferOrderDto {
  id
  key
  description
  receiver
  createdBy
  removedAt
  createdAt
  targetLocation {
    ...SimpleLocation
  }
  targetLoader {
    ...Loader
  }
  items {
    ...TransferOrderItem
  }
}

fragment SimpleTransferOrder on TransferOrderDto {
  id
  key
  description
  receiver
  createdBy
  removedAt
  createdAt
}

fragment TransferVendorOrderItem on TransferVendorOrderItemDto {
  id
  materialId
  batchId
  locationId
  loaderId
  vendorId
  orderId
  unitId
  targetTransferredQuantity
}

fragment TransferVendorOrder on TransferVendorOrderDto {
  id
  key
  createdAt
  items {
    ...TransferVendorOrderItem
  }
}

fragment TransferCustomerOrderItem on TransferCustomerOrderItemDto {
  id
  materialId
  batchId
  locationId
  loaderId
  customerId
  orderId
  unitId
  targetTransferredQuantity
}

fragment TransferCustomerOrder on TransferCustomerOrderDto {
  id
  key
  createdAt
  items {
    ...TransferCustomerOrderItem
  }
}
