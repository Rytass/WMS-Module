fragment MapData on MapDataDto {
  id
  backgrounds {
    id
    filename
    x
    y
    height
    width
  }
  ranges {
    ... on MapRectangleRangeDto {
      location {
        id
        key
        isActive
      }
      id
      type
      color
      x
      y
      width
      height
    }
    ... on MapPolygonRangeDto {
      location {
        id
        key
        isActive
      }
      id
      type
      color
      points {
        x
        y
      }
    }
  }
}
