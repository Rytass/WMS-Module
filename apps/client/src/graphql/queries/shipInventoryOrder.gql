query ShipInventoryOrder($shipInventoryOrderId: ID!) {
  shipInventoryOrder(id: $shipInventoryOrderId) {
    ...ShipInventoryOrder
  }
}

query ShipInventoryOrders(
  $offset: Int
  $limit: Int
  $key: String
  $createdBy: String
  $status: ShipInventoryOrderStatus
  $statuses: [ShipInventoryOrderStatus!]
  $dateRange: DateRangeArgs
  $description: String
) {
  shipInventoryOrders(
    offset: $offset
    limit: $limit
    key: $key
    createdBy: $createdBy
    status: $status
    statuses: $statuses
    dateRange: $dateRange
    description: $description
  ) {
    id
    items {
      ...SimpleShipInventoryOrder
    }
    total
  }
}

query ShipInventoryOrderOptions($offset: Int, $limit: Int, $key: String) {
  shipInventoryOrders(offset: $offset, limit: $limit, key: $key) {
    id
    items {
      id
      key
    }
    total
  }
}

query ShipInventoryOrderPendingOptions(
  $offset: Int
  $limit: Int
  $key: String
) {
  shipInventoryOrders(
    offset: $offset
    limit: $limit
    key: $key
    statuses: [PENDING, PARTIAL_SHIPPED]
  ) {
    id
    items {
      id
      key
    }
    total
  }
}

query FullShipInventoryOrders(
  $offset: Int
  $limit: Int
  $key: String
  $createdBy: String
  $status: ShipInventoryOrderStatus
  $statuses: [ShipInventoryOrderStatus!]
  $dateRange: DateRangeArgs
  $description: String
) {
  shipInventoryOrders(
    offset: $offset
    limit: $limit
    key: $key
    createdBy: $createdBy
    status: $status
    statuses: $statuses
    dateRange: $dateRange
    description: $description
  ) {
    id
    items {
      ...ShipInventoryOrder
    }
    total
  }
}
