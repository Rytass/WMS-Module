query ChangeLogs(
  $offset: Int
  $limit: Int
  $materialId: ID
  $batchId: ID
  $locationId: ID
  $loaderId: ID
  $ids: [ID!]
  $description: String
  $status: StockStatus
  $materialKey: String
  $batchKey: String
  $locationKey: String
  $loaderKey: String
) {
  changeLogs(
    offset: $offset
    limit: $limit
    materialId: $materialId
    batchId: $batchId
    locationId: $locationId
    loaderId: $loaderId
    ids: $ids
    description: $description
    status: $status
    materialKey: $materialKey
    batchKey: $batchKey
    locationKey: $locationKey
    loaderKey: $loaderKey
  ) {
    id
    items {
      ...ChangeLog
    }
    total
  }
}
