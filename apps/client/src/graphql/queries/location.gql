query Location($locationId: ID!) {
  location(id: $locationId) {
    ...Location
  }
}

query Locations(
  $offset: Int
  $limit: Int
  $description: String
  $key: String
  $isActive: Boolean
  $root: Boolean
) {
  locations(
    offset: $offset
    limit: $limit
    description: $description
    key: $key
    isActive: $isActive
    root: $root
  ) {
    id
    items {
      ...Location
    }
    total
  }
}

query AllRootLocations {
  locations(offset: null, limit: null, root: true) {
    id
    items {
      ...Location
    }
    total
  }
}

query LocationOptions(
  $offset: Int
  $limit: Int
  $key: String
  $isActive: Boolean
) {
  locations(offset: $offset, limit: $limit, key: $key, isActive: $isActive) {
    id
    items {
      id
      key
    }
    total
  }
}
