query Location($locationId: ID!) {
  location(id: $locationId) {
    ...Location
  }
}

query Locations($offset: Int, $limit: Int, $description: String, $key: String) {
  locations(
    offset: $offset
    limit: $limit
    description: $description
    key: $key
  ) {
    id
    items {
      ...Location
    }
    total
  }
}
