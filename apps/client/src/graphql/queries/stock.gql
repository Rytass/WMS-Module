query Stock($stockId: ID!) {
  stock(id: $stockId) {
    ...Stock
  }
}

query Stocks(
  $offset: Int
  $limit: Int
  $materialId: ID
  $batchId: ID
  $locationId: ID
  $loaderId: ID
  $description: String
) {
  stocks(
    offset: $offset
    limit: $limit
    materialId: $materialId
    batchId: $batchId
    locationId: $locationId
    loaderId: $loaderId
    description: $description
  ) {
    id
    items {
      ...Stock
    }
    total
  }
}

query StocksGroupedByMaterial(
  $offset: Int
  $limit: Int
  $materialId: ID
  $batchId: ID
  $locationId: ID
  $loaderId: ID
  $description: String
) {
  stocksGroupedByMaterial(
    offset: $offset
    limit: $limit
    materialId: $materialId
    batchId: $batchId
    locationId: $locationId
    loaderId: $loaderId
    description: $description
  ) {
    id
    items {
      ...MaterialWithAggregatedStock
    }
    total
  }
}

query AggregatedStocks(
  $offset: Int
  $limit: Int
  $materialId: ID
  $batchId: ID
  $locationId: ID
  $loaderId: ID
  $description: String
) {
  aggregatedStocks(
    offset: $offset
    limit: $limit
    materialId: $materialId
    batchId: $batchId
    locationId: $locationId
    loaderId: $loaderId
    description: $description
  ) {
    id
    items {
      ...AggregatedStock
    }
    total
  }
}
