query ReceiveInventoryOrder($receiveInventoryOrderId: ID!) {
  receiveInventoryOrder(id: $receiveInventoryOrderId) {
    ...ReceiveInventoryOrder
  }
}

query ReceiveInventoryOrders(
  $offset: Int
  $limit: Int
  $receiveInventoryOrdersId: ID
  $key: String
  $createdBy: String
  $status: ReceiveInventoryOrderStatus
  $statuses: [ReceiveInventoryOrderStatus!]
  $dateRange: DateRangeArgs
  $description: String
) {
  receiveInventoryOrders(
    offset: $offset
    limit: $limit
    id: $receiveInventoryOrdersId
    key: $key
    createdBy: $createdBy
    status: $status
    statuses: $statuses
    dateRange: $dateRange
    description: $description
  ) {
    id
    items {
      ...SimpleReceiveInventoryOrder
    }
    total
  }
}

query FullReceiveInventoryOrders(
  $offset: Int
  $limit: Int
  $receiveInventoryOrdersId: ID
  $key: String
  $createdBy: String
  $status: ReceiveInventoryOrderStatus
  $statuses: [ReceiveInventoryOrderStatus!]
