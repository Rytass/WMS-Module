query Batches($offset: Int, $limit: Int, $key: String) {
  batches(offset: $offset, limit: $limit, key: $key) {
    id
    items {
      ...Batch
    }
    total
  }
}

query BatchOptions($offset: Int, $limit: Int, $key: String) {
  batches(offset: $offset, limit: $limit, key: $key) {
    id
    items {
      id
      key
    }
    total
  }
}
