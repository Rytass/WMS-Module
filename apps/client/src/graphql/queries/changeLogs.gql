query ChangeLogs(
  $offset: Int
  $limit: Int
  $materialId: ID
  $batchId: ID
  $locationId: ID
  $loaderId: ID
  $description: String
  $status: StockStatus
) {
  changeLogs(
    offset: $offset
    limit: $limit
    materialId: $materialId
    batchId: $batchId
    locationId: $locationId
    loaderId: $loaderId
    description: $description
    status: $status
  ) {
    id
    items {
      ...AggregatedStock
    }
    total
  }
}
