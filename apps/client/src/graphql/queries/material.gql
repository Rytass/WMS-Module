query Materials($offset: Int, $limit: Int, $key: String, $description: String) {
  materials(
    offset: $offset
    limit: $limit
    key: $key
    description: $description
  ) {
    id
    items {
      ...SimpleMaterial
    }
    total
  }
}

query MaterialOptions($offset: Int, $limit: Int, $key: String) {
  materials(offset: $offset, limit: $limit, key: $key) {
    id
    items {
      id
      key
    }
    total
  }
}

query Material($materialId: ID, $key: String) {
  material(id: $materialId, key: $key) {
    ...Material
  }
}
