query Loader($loaderId: ID!) {
  loader(id: $loaderId) {
    ...Loader
  }
}

query Loaders(
  $offset: Int
  $limit: Int
  $key: String
  $typeId: ID
  $typeIds: [ID!]
  $locationId: ID
  $locationIds: [ID!]
  $serialId: String
  $serialIds: [String!]
  $isActive: Boolean
  $dateRange: DateRangeArgs
  $note: String
) {
  loaders(
    offset: $offset
    limit: $limit
    key: $key
    typeId: $typeId
    typeIds: $typeIds
    locationId: $locationId
    locationIds: $locationIds
    serialId: $serialId
    serialIds: $serialIds
    isActive: $isActive
    dateRange: $dateRange
    note: $note
  ) {
    id
    items {
      ...Loader
    }
    total
  }
}

query LoaderOptions(
  $offset: Int
  $limit: Int
  $key: String
  $locationId: ID
  $isActive: Boolean
) {
  loaders(
    offset: $offset
    limit: $limit
    key: $key
    locationId: $locationId
    isActive: $isActive
  ) {
    id
    items {
      id
      serialId
    }
    total
  }
}

query LoaderType($loaderTypeId: ID!) {
  loaderType(id: $loaderTypeId) {
    ...LoaderType
  }
}

query LoaderTypes(
  $offset: Int
  $limit: Int
  $description: String
  $isActive: Boolean
  $createdAt: DateRangeArgs
  $key: String
) {
  loaderTypes(
    offset: $offset
    limit: $limit
    description: $description
    isActive: $isActive
    createdAt: $createdAt
    key: $key
  ) {
    id
    items {
      ...LoaderType
    }
    total
  }
}

query LoaderTypeOptions(
  $offset: Int
  $limit: Int
  $description: String
  $key: String
  $isActive: Boolean
) {
  loaderTypes(
    offset: $offset
    limit: $limit
    description: $description
    key: $key
    isActive: $isActive
  ) {
    id
    items {
      id
      key
      description
    }
    total
  }
}

query LoaderUnits($type: LoaderUnit!) {
  loaderUnits(type: $type) {
    id
  }
}
