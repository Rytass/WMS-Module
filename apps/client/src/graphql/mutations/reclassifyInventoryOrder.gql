mutation ReclassifyInventoryOrder(
  $aggregatedKey: ID!
  $materialKey: ID!
  $items: [ReclassifyInventoryOrderItemInput!]!
) {
  reclassifyInventoryOrder(
    aggregatedKey: $aggregatedKey
    materialKey: $materialKey
    items: $items
  ) {
    id
    key
    createdAt
    items {
      ...ReclassifyInventoryOrderItem
    }
  }
}
