mutation CreateTransferOrder(
  $locationId: ID!
  $items: [CreateTransferOrderItemArgs!]!
  $description: String
  $loaderId: ID
  $receiver: String
  $createdBy: String
) {
  createTransferOrder(
    locationId: $locationId
    items: $items
    description: $description
    loaderId: $loaderId
    receiver: $receiver
    createdBy: $createdBy
  ) {
    ...TransferOrder
  }
}

mutation UpdateTransferOrder(
  $updateTransferOrderId: ID!
  $description: String
  $locationId: ID
  $loaderId: ID
  $receiver: String
  $createdBy: String
  $removedAt: DateTime
  $items: [UpdateTransferOrderItemArgs!]
) {
  updateTransferOrder(
    id: $updateTransferOrderId
    description: $description
    locationId: $locationId
    loaderId: $loaderId
    receiver: $receiver
    createdBy: $createdBy
    removedAt: $removedAt
    items: $items
  ) {
    ...TransferOrder
  }
}

mutation CreateTransferCustomerOrder(
  $customerId: String!
  $items: [CreateTransferCustomerOrderItemArgs!]!
  $description: String
  $createdBy: String
) {
  createTransferCustomerOrder(
    customerId: $customerId
    items: $items
    description: $description
    createdBy: $createdBy
  ) {
    id
    key
    createdAt
  }
}

mutation ReturnTransferCustomerOrder(
  $items: [ReturnTransferCustomerOrderArgs!]!
) {
  returnTransferCustomerOrder(items: $items)
}

mutation CreateTransferVendorOrder(
  $vendorId: String!
  $items: [CreateTransferVendorOrderItemArgs!]!
  $description: String
  $createdBy: String
) {
  createTransferVendorOrder(
    vendorId: $vendorId
    items: $items
    description: $description
    createdBy: $createdBy
  ) {
    id
    key
    createdAt
  }
}

mutation ReturnTransferVendorOrder($items: [ReturnTransferVendorOrderArgs!]!) {
  returnTransferVendorOrder(items: $items)
}
