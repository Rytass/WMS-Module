mutation CreateShipInventoryOrder(
  $key: ID!
  $description: String!
  $references: [CreateShipInventoryOrderReferenceArgs!]!
) {
  createShipInventoryOrder(
    key: $key
    description: $description
    references: $references
  ) {
    ...ShipInventoryOrder
  }
}

mutation UpdateShipInventoryOrder(
  $updateShipInventoryOrderId: ID!
  $description: String
  $removedAt: DateTime
  $references: [UpdateShipInventoryOrderReferenceArgs!]
  $items: [UpdateShipInventoryOrderItemArgs!]
) {
  updateShipInventoryOrder(
    id: $updateShipInventoryOrderId
    description: $description
    removedAt: $removedAt
    references: $references
    items: $items
  ) {
    ...ShipInventoryOrder
  }
}
