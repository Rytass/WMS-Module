mutation CreateLoader(
  $typeId: ID!
  $serialId: String!
  $locationId: ID!
  $quantity: Int!
  $length: Float
  $width: Float
  $height: Float
  $sizeUnit: String
  $volume: Float
  $volumeUnit: String
  $note: String
) {
  createLoader(
    typeId: $typeId
    serialId: $serialId
    locationId: $locationId
    quantity: $quantity
    length: $length
    width: $width
    height: $height
    sizeUnit: $sizeUnit
    volume: $volume
    volumeUnit: $volumeUnit
    note: $note
  ) {
    ...Loader
  }
}

mutation CreateBatchLoader(
  $typeId: ID!
  $serialId: String!
  $locationId: ID!
  $quantity: Int!
  $length: Float
  $width: Float
  $height: Float
  $sizeUnit: String
  $volume: Float
  $volumeUnit: String
  $note: String
) {
  createBatchLoader(
    typeId: $typeId
    serialId: $serialId
    locationId: $locationId
    quantity: $quantity
    length: $length
    width: $width
    height: $height
    sizeUnit: $sizeUnit
    volume: $volume
    volumeUnit: $volumeUnit
    note: $note
  ) {
    ...Loader
  }
}

mutation UpdateLoader(
  $updateLoaderId: ID!
  $quantity: Int
  $length: Float
  $width: Float
  $height: Float
  $sizeUnit: String
  $volume: Float
  $volumeUnit: String
  $note: String
) {
  updateLoader(
    id: $updateLoaderId
    quantity: $quantity
    length: $length
    width: $width
    height: $height
    sizeUnit: $sizeUnit
    volume: $volume
    volumeUnit: $volumeUnit
    note: $note
  ) {
    ...Loader
  }
}

mutation CreateLoaderType(
  $createLoaderTypeId: ID!
  $description: String!
  $serial: String!
) {
  createLoaderType(
    id: $createLoaderTypeId
    description: $description
    serial: $serial
  ) {
    ...LoaderType
  }
}

mutation UpdateLoaderType($updateLoaderTypeId: ID!, $description: String) {
  updateLoaderType(id: $updateLoaderTypeId, description: $description) {
    ...LoaderType
  }
}
