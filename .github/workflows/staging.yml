name: Staging Server

on:
  push:
    branches: [staging]

jobs:
  tagging:
    runs-on: self-hosted

    outputs:
      tag: ${{ steps.tagging.outputs.tag }}

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - id: tagging
        name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.69.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # if you don't want to set write permissions use a PAT token
          DEFAULT_BUMP: patch
          DEFAULT_BRANCH: main
          WITH_V: true
          RELEASE_BRANCHES: release

  build:
    runs-on: self-hosted
    needs: tagging

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: asia-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GAR_JSON_KEY }}

      - name: Build docker image (Client)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=local,src=/tmp/runner-cache
          cache-to: type=local,dest=/tmp/runner-cache,mode=min,compression=zstd
          tags: asia-east1-docker.pkg.dev/develop-server/wms-module/client:${{ needs.tagging.outputs.tag }}
          build-args: |
            TARGET=client
            NEXT_PUBLIC_IS_DEV=1
            API_HOST=https://wms-module-staging.rytass.info

      - name: Build docker image (Admin)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=local,src=/tmp/runner-cache
          cache-to: type=local,dest=/tmp/runner-cache,mode=min,compression=zstd
          tags: asia-east1-docker.pkg.dev/develop-server/wms-module/admin:${{ needs.tagging.outputs.tag }}
          build-args: |
            TARGET=admin
            NEXT_PUBLIC_IS_DEV=1

      - name: Build docker image (API)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=local,src=/tmp/runner-cache
          cache-to: type=local,dest=/tmp/runner-cache,mode=min,compression=zstd
          tags: asia-east1-docker.pkg.dev/develop-server/wms-module/api:${{ needs.tagging.outputs.tag }}
          build-args: |
            TARGET=api

  update-deployments:
    runs-on: self-hosted
    needs:
      - tagging
      - build

    permissions:
      contents: read
      packages: write

    steps:
      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: ${{ secrets.GAR_JSON_KEY }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: 'Update image on GKE'
        run: |-
          gcloud components install kubectl
          gcloud container clusters get-credentials rytass-cluster --region asia-east1 --project develop-server
          kubectl -n wms-module-staging set image deployments/application client=asia-east1-docker.pkg.dev/develop-server/wms-module/client:${{ needs.tagging.outputs.tag }}
          kubectl -n wms-module-staging set image deployments/application admin=asia-east1-docker.pkg.dev/develop-server/wms-module/admin:${{ needs.tagging.outputs.tag }}
          kubectl -n wms-module-staging set image deployments/application api=asia-east1-docker.pkg.dev/develop-server/wms-module/api:${{ needs.tagging.outputs.tag }}
