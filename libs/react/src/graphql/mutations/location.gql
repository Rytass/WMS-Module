mutation CreateLocation($key: String!, $description: String!, $parentId: ID) {
  createLocation(key: $key, description: $description, parentId: $parentId) {
    ...Location
  }
}

mutation UpdateLocation(
  $updateLocationId: ID!
  $description: String
  $isActive: Boolean
  $parentId: ID
) {
  updateLocation(
    id: $updateLocationId
    description: $description
    isActive: $isActive
    parentId: $parentId
  ) {
    ...Location
  }
}
