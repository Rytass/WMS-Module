mutation CreateBatchLoader($items: [CreateLoadersArgs!]!) {
  createBatchLoader(items: $items) {
    ...Loader
  }
}

mutation UpdateLoader(
  $updateLoaderId: ID!
  $quantity: Int
  $length: Float
  $width: Float
  $height: Float
  $sizeUnit: String
  $volume: Float
  $volumeUnit: String
  $note: String
  $isActive: Boolean
) {
  updateLoader(
    id: $updateLoaderId
    quantity: $quantity
    length: $length
    width: $width
    height: $height
    sizeUnit: $sizeUnit
    volume: $volume
    volumeUnit: $volumeUnit
    note: $note
    isActive: $isActive
  ) {
    ...Loader
  }
}

mutation CreateLoaderType($key: String!, $description: String!) {
  createLoaderType(key: $key, description: $description) {
    ...LoaderType
  }
}

mutation UpdateLoaderType(
  $updateLoaderTypeId: ID!
  $description: String
  $isActive: Boolean
) {
  updateLoaderType(
    id: $updateLoaderTypeId
    description: $description
    isActive: $isActive
  ) {
    ...LoaderType
  }
}
