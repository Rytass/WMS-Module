query ReceiveInventoryOrder($receiveInventoryOrderId: ID!) {
  receiveInventoryOrder(id: $receiveInventoryOrderId) {
    ...ReceiveInventoryOrder
  }
}

query ReceiveInventoryOrders(
  $offset: Int
  $limit: Int
  $createdBy: String
  $status: ReceiveInventoryOrderStatus
  $statuses: [ReceiveInventoryOrderStatus!]
  $dateRange: DateRangeArgs
  $description: String
  $key: String
  $materialKey: String
  $batchKey: String
  $locationKey: String
  $loaderKey: String
) {
  receiveInventoryOrders(
    offset: $offset
    limit: $limit
    createdBy: $createdBy
    status: $status
    statuses: $statuses
    dateRange: $dateRange
    description: $description
    key: $key
    materialKey: $materialKey
    batchKey: $batchKey
    locationKey: $locationKey
    loaderKey: $loaderKey
  ) {
    id
    items {
      ...SimpleReceiveInventoryOrder
    }
    total
  }
}

query ReceiveInventoryOrderOptions($offset: Int, $limit: Int, $key: String) {
  receiveInventoryOrders(offset: $offset, limit: $limit, key: $key) {
    id
    items {
      id
      key
    }
    total
  }
}

query ReceiveInventoryOrderPendingOptions(
  $offset: Int
  $limit: Int
  $key: String
) {
  receiveInventoryOrders(
    offset: $offset
    limit: $limit
    key: $key
    statuses: [PENDING, PARTIAL_RECEIVED]
  ) {
    id
    items {
      id
      key
    }
    total
  }
}

query FullReceiveInventoryOrders(
  $offset: Int
  $limit: Int
  $key: String
  $createdBy: String
  $status: ReceiveInventoryOrderStatus
  $statuses: [ReceiveInventoryOrderStatus!]
  $dateRange: DateRangeArgs
  $description: String
  $materialKey: String
  $batchKey: String
  $locationKey: String
  $loaderKey: String
) {
  receiveInventoryOrders(
    offset: $offset
    limit: $limit
    key: $key
    createdBy: $createdBy
    status: $status
    statuses: $statuses
    dateRange: $dateRange
    description: $description
    materialKey: $materialKey
    batchKey: $batchKey
    locationKey: $locationKey
    loaderKey: $loaderKey
  ) {
    id
    items {
      ...ReceiveInventoryOrder
    }
    total
  }
}
