query Materials(
  $offset: Int
  $limit: Int
  $key: String
  $description: String
  $sort: MaterialSortInput
) {
  materials(
    offset: $offset
    limit: $limit
    key: $key
    description: $description
    sort: $sort
  ) {
    id
    items {
      ...SimpleMaterial
    }
    total
  }
}

query MaterialOptions($offset: Int, $limit: Int, $key: String) {
  materials(offset: $offset, limit: $limit, key: $key) {
    id
    items {
      id
      key
    }
    total
  }
}

query Material($materialId: ID, $key: String) {
  material(id: $materialId, key: $key) {
    ...Material
  }
}
