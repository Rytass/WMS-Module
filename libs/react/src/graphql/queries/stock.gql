query Stock($stockId: ID!) {
  stock(id: $stockId) {
    ...Stock
  }
}

query Stocks(
  $offset: Int
  $limit: Int
  $materialId: ID
  $batchId: ID
  $locationId: ID
  $loaderId: ID
  $description: String
) {
  stocks(
    offset: $offset
    limit: $limit
    materialId: $materialId
    batchId: $batchId
    locationId: $locationId
    loaderId: $loaderId
    description: $description
  ) {
    id
    items {
      ...Stock
    }
    total
  }
}

query StocksGroupedByMaterial(
  $offset: Int
  $limit: Int
  $materialId: ID
  $batchId: ID
  $locationId: ID
  $loaderId: ID
  $status: StockStatus
  $description: String
  $materialKey: String
  $batchKey: String
  $locationKey: String
  $loaderKey: String
  $vendorId: String
  $customerId: String
  $saleId: String
  $saleSerialId: String
) {
  stocksGroupedByMaterial(
    offset: $offset
    limit: $limit
    materialId: $materialId
    batchId: $batchId
    locationId: $locationId
    loaderId: $loaderId
    status: $status
    description: $description
    materialKey: $materialKey
    batchKey: $batchKey
    locationKey: $locationKey
    loaderKey: $loaderKey
    vendorId: $vendorId
    customerId: $customerId
    saleId: $saleId
    saleSerialId: $saleSerialId
  ) {
    id
    items {
      ...MaterialWithAggregatedStock
    }
    total
  }
}

query AggregatedStocks(
  $offset: Int
  $limit: Int
  $materialId: ID
  $batchId: ID
  $locationId: ID
  $loaderId: ID
  $status: StockStatus
  $description: String
  $materialKey: String
  $batchKey: String
  $locationKey: String
  $loaderKey: String
  $vendorId: String
  $customerId: String
  $saleId: String
  $saleSerialId: String
) {
  aggregatedStocks(
    offset: $offset
    limit: $limit
    materialId: $materialId
    batchId: $batchId
    locationId: $locationId
    loaderId: $loaderId
    status: $status
    description: $description
    materialKey: $materialKey
    batchKey: $batchKey
    locationKey: $locationKey
    loaderKey: $loaderKey
    vendorId: $vendorId
    customerId: $customerId
    saleId: $saleId
    saleSerialId: $saleSerialId
  ) {
    id
    items {
      ...AggregatedStock
    }
    total
  }
}

query AggregatedStocksForInventoryActions($ids: [ID!], $status: StockStatus) {
  aggregatedStocks(offset: null, limit: null, ids: $ids, status: $status) {
    id
    items {
      ...StockInActions
    }
    total
  }
}
