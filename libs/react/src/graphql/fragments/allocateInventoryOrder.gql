fragment AllocateInventoryOrderItem on AllocateInventoryOrderItemDto {
  id
  targetAllocatedQuantity
  saleId
  saleSerialId
}

fragment AllocateInventoryOrder on AllocateInventoryOrderDto {
  id
  key
  createdAt
  items {
    ...AllocateInventoryOrderItem
  }
}

fragment SimplerAllocateInventoryOrder on AllocateInventoryOrderDto {
  id
  key
  createdAt
}
