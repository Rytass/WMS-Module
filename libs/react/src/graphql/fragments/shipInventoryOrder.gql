fragment ShipInventoryOrderItem on ShipInventoryOrderItemDto {
  id
  serialId
  saleId
  saleSerialId
  unitId
  targetShippedQuantity
  orderId
  materialId
  batchId
  removedAt
  material {
    ...SimpleMaterial
  }
  batch {
    ...Batch
  }
  location {
    ...SimpleLocation
  }
  loader {
    ...Loader
  }
  shippedQuantity
}

fragment ShipInventoryOrderReference on ShipInventoryOrderReferenceDto {
  id
  serialId
  saleId
  saleSerialId
  unitId
  targetShippedQuantity
  removedAt
  material {
    ...SimpleMaterial
  }
  batch {
    ...Batch
  }
  shippedQuantity
  items {
    ...ShipInventoryOrderItem
  }
}

fragment ShipInventoryOrder on ShipInventoryOrderDto {
  id
  key
  description
  createdAt
  createdBy
  removedAt
  status
  references {
    ...ShipInventoryOrderReference
  }
  items {
    ...ShipInventoryOrderItem
  }
}

fragment SimpleShipInventoryOrder on ShipInventoryOrderDto {
  id
  key
  description
  createdAt
  createdBy
  removedAt
  status
}
