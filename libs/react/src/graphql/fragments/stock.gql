fragment Stock on StockDto {
  id
  loaderId
  material {
    ...SimpleMaterial
  }
  location {
    ...Location
  }
  batch {
    ...Batch
  }
}

fragment SimpleStock on StockDto {
  id
  loaderId
}

fragment AggregatedStock on AggregatedStockDto {
  id
  key: id
  quantity
  transferId
  held
  inShipment
  saleId
  saleSerialId
  customerId
  vendorId
  inspectionResult
  status
  material {
    ...SimpleMaterial
  }
  batch {
    ...Batch
  }
  location {
    ...SimpleLocation
  }
  loader {
    ...Loader
  }
}

fragment StockInActions on AggregatedStockDto {
  id
  key: id
  quantity
  transferId
  held
  inShipment
  saleId
  saleSerialId
  customerId
  vendorId
  inspectionResult
  status
  material {
    ...SimpleMaterial
  }
  batch {
    ...Batch
  }
  location {
    ...SimpleLocation
  }
  loader {
    ...LoaderWithTotal
  }
}
